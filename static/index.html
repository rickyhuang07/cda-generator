<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit CDA Information</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <p class="eyebrow">RealtyOne Plus</p>
    <h1>Submit CDA information</h1>
    <p class="lede">Upload your worksheet or complete the required fields. The owner will review your submission and generate the PDF.</p>
    <a class="owner-link" href="/owner">Owner review</a>
  </header>

  <main>
    <section class="card upload-box">
      <label for="file"><strong>Optional Excel worksheet</strong><span class="hint">Upload a .xlsx or .xlsm file to prefill the form.</span></label>
      <input id="file" type="file" accept=".xlsx,.xlsm" />
      <p id="filename" class="filename"></p>
    </section>

    <section class="card" id="preview-card">
      <div class="section-head">
        <h2>Parsed transaction</h2>
        <span id="warnings" class="warnings"></span>
      </div>
      <form id="submission-form">
      <div class="grid">
        <label>Escrow Agent *<input id="closer" required /></label>
        <label>Escrow Agent's Email *<input id="closer_email" type="email" required /></label>
        <label>Escrow Agent's Phone *<input id="closer_phone" required /></label>
        <label>Title Company *<input id="title_company" required /></label>
        <label>Title Company Address *<input id="title_company_address" required /></label>
        <label>Escrow Number *<input id="escrow_no" required /></label>
        <label>Gross Commission *<input id="gross_commission" required /></label>
        <label>MLS *<input id="mls" required /></label>
        <label>Sale Price *<input id="sale_price" required /></label>
        <label>Property Address *<input id="property_address" required /></label>
        <label>Buyer / Tenant *<input id="buyer" required /></label>
        <label>Close Date *<input id="close_date" required placeholder="MM/DD/YYYY" /></label>
        <label>Seller / Landlord *<input id="seller" required /></label>
        <label>Selling Agent *<input id="selling_agent" required /></label>
        <label>Broker Process Fees *<input id="broker_process_fees" required /></label>
        <label>Agent Commission *<input id="selling_agent_commission" required /></label>
        <label class="wide">Agent Payee Mailing Address *<input id="agent_payee_address" required /></label>
      </div>
      <div class="actions">
        <button type="submit">Submit for owner review</button>
        <span id="message" class="message" role="status"></span>
      </div>
      </form>
    </section>
  </main>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
