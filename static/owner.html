<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Review | CDA</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <p class="eyebrow">Owner workspace</p>
    <h1>Review submissions</h1>
    <p class="lede">Open a submission, verify the details, then generate its CDA PDF.</p>
    <a class="owner-link" href="/">Submitter view</a>
  </header>
  <main class="owner-layout">
    <section class="card">
      <div class="section-head"><h2>Inbox</h2><button id="refresh" type="button">Refresh</button></div>
      <div id="submission-list" class="submission-list"><p class="hint">Loading submissions...</p></div>
    </section>
    <section class="card" id="detail-card">
      <h2>Submission details</h2>
      <p id="empty-detail" class="hint">Select a submission to review.</p>
      <div id="detail" class="detail hidden"></div>
      <div class="actions"><button id="generate" type="button" disabled>Generate CDA PDF</button><span id="owner-message" class="message" role="status"></span></div>
    </section>
  </main>
  <script src="/static/owner.js?v=1"></script>
</body>
</html>
