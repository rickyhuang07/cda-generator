<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Review | CDA</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <p class="eyebrow">Owner workspace</p>
    <h1>Review submissions</h1>
    <p class="lede">Open a submission, verify the details, then generate its CDA PDF.</p>
    <a class="owner-link" href="/">Submitter view</a>
  </header>
  <main class="owner-layout">
    <section class="card" id="login-card">
      <h2>Owner sign in</h2>
      <form id="login-form" class="login-form">
        <label>Password <input id="owner-password" type="password" required /></label>
        <button type="submit">Sign in</button>
        <span id="login-message" class="message" role="status"></span>
      </form>
    </section>
    <div id="owner-content" class="owner-content hidden">
    <section class="card">
      <div class="section-head"><h2>Inbox</h2><div><button id="refresh" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div></div>
      <div id="submission-list" class="submission-list"><p class="hint">Loading submissions...</p></div>
    </section>
    <section class="card" id="detail-card">
      <h2>Submission details</h2>
      <p id="empty-detail" class="hint">Select a submission to review.</p>
      <div id="detail" class="detail hidden"></div>
      <div class="actions"><button id="generate" type="button" disabled>Generate CDA PDF</button><button id="delete" class="danger" type="button" disabled>Delete submission</button><span id="owner-message" class="message" role="status"></span></div>
    </section>
    </div>
  </main>
  <script src="/static/owner.js?v=4"></script>
</body>
</html>
